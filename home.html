<!DOCTYPE html>
<html lang="en">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="isi-iframe">
  <h2 class="judul-page">Bienvenue à Gusteau's</h2>
  
  <div class="kotak" style="text-align:center; background: linear-gradient(135deg, #f9f5ed 0%, #f0e6d2 100%);">
    <p style="font-size: 18px; font-style: italic; color: var(--text-dark);">
      "Good food is like music you can taste, color you can smell."
    </p>
  </div>

  <h3 id="highlights" style="margin: 30px 0 15px 0; color: var(--accent-rust); text-align:center; font-style:italic; font-size: 24px;">Chef's Picks</h3>
  
  <div class="grid-cards">
    <div class="kartu">
      <div class="img-placeholder herbs"></div>
      <h3>Provencal Herbs</h3>
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 5px;">Shipped by Provence Herbs Co.</p>
      <p class="harga">Rp45.000</p>
      <button class="tombol" onclick="parent.loadPage('cart.html')">Add to Cart</button>
    </div>

    <div class="kartu">
      <div class="img-placeholder pan"></div>
      <h3>Copper Saute Pan</h3>
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 5px;">Shipped by Atelier Cuisine</p>
      <p class="harga">Rp450.000</p>
      <button class="tombol" onclick="parent.loadPage('cart.html')">Add to Cart</button>
    </div>

    <div class="kartu">
      <div class="img-placeholder pepper"></div>
      <h3>Espelette Pepper</h3>
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 5px;">Shipped by Provence Herbs Co.</p>
      <p class="harga">Rp65.000</p>
      <button class="tombol" onclick="parent.loadPage('cart.html')">Add to Cart</button>
    </div>
  </div>
</body>
</html>
