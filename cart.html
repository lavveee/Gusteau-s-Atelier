<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gusteau’s Atelier — Shopping Cart</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* MEMASTIKAN TOMBOL KEMBALI KE POSISI BAWAH DAN TIDAK NYASAR KE HEADER */
    header .tombol, header a.tombol {
      display: none !important;
    }
    .cart-actions-top {
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
      margin-bottom: 25px !important;
    }
  </style>
</head>
<body>
  <div class="promo-bar">Free shipping on orders over Rp200.000</div>

  <header>
    <div class="header-container">
      <h1 class="logo" onclick="window.location.href='index.html'">Gusteau’s Atelier</h1>
      <nav>
        <a href="index.html" class="nav-link">Home</a>
        <a href="shop.html" class="nav-link">Shop Catalog</a>
        <a href="news.html" class="nav-link">News &amp; Articles</a>
        <a href="distributor.html" class="nav-link">Distributors</a>
        <a href="about.html" class="nav-link">Our Story</a>
      </nav>
      <div><a class="tombol tombol-cart" href="cart.html">🛒 Cart (<span id="cart-count">1</span>)</a></div>
    </div>
  </header>

  <main class="main-container">
    <div style="text-align: center; margin-bottom: 30px;">
      <h2 class="judul-section" style="margin-bottom: 8px;">Your Shopping Cart</h2>
    </div>

    <!-- TOMBOL CONTINUE SHOPPING DI ATAS -->
    <div class="cart-actions-top">
      <a href="shop.html" class="tombol" style="background-color: #6b705c; color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-size: 14px; display: inline-block;">← Continue Shopping</a>
    </div>

    <!-- DAFTAR ITEM KERANJANG -->
    <div id="cart-items-container">
      <!-- Item keranjang dirender dinamis dari main.js -->
    </div>

    <!-- RINGKASAN PEMBAYARAN DAN TOMBOL CHECKOUT -->
    <div class="cart-summary-box" style="background: #faf7f2; border: 2px solid #d1c7bd; border-radius: 16px; padding: 25px; margin-top: 25px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 style="font-family: 'Playfair Display', serif; font-size: 20px; color: #2c221e;">Total Payment:</h3>
        <span id="cart-grand-total" style="font-size: 22px; font-weight: bold; color: #78290f;">Rp75.000</span>
      </div>
      
      <div style="text-align: right;">
        <a href="checkout.html" class="tombol" style="background-color: #78290f; color: #fff; text-decoration: none; padding: 12px 30px; border-radius: 8px; font-size: 15px; display: inline-block;">Proceed to Checkout →</a>
      </div>
    </div>
  </main>

  <footer><p>&copy; 2026 Gusteau’s Atelier. Inspired by Ratatouille.</p></footer>
  <script src="js/main.js"></script>
</body>
</html>
